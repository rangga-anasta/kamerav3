<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <script src='https://cdn.tailwindcss.com'></script>
    <script src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs'></script>
    <script src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd'></script>
    <style>
        body{margin:0;padding:1rem;background-color:#111;color:white;font-family:sans-serif;}
        #app-container{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
        
        #video-container{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:0.75rem;border:2px solid #374151;overflow:hidden;display:flex;justify-content:center;align-items:center;}
        
        video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
        video{opacity:0;z-index:1}
        canvas{z-index:10}
        
        #ui-panel{background:#1f2937;padding:1rem;border-radius:0.75rem;border:1px solid #374151;}
        .overlay-box{position:absolute;z-index:30;background:rgba(0,0,0,0.85);padding:1.5rem;border-radius:1rem;text-align:center;border:1px solid #444;width:85%;max-width:300px;}
        .spinner{border:4px solid rgba(255,255,255,0.2);border-top:4px solid #3b82f6;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 10px auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div id='app-container'>
        <div id='video-container'>
            <div id='start-panel' class='overlay-box flex flex-col items-center gap-4'>
                <h2 class='text-lg font-bold text-white'>AI CCTV Siap</h2>
                <p class='text-xs text-gray-400'>Mode Ringan & Ringkas Aktif.</p>
                <button id='btn-start-app' class='bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition transform hover:scale-105'>Nyalakan Kamera</button>
            </div>
            <div id='loading-msg' class='overlay-box' style='display:none'>Memuat...</div>
            <video id='webcam' autoplay playsinline muted></video>
            <canvas id='output_canvas'></canvas>
        </div>
        
        <div id='ui-panel' class='flex flex-col gap-4 shadow-lg'>
            <div class='flex justify-between items-center'>
                <div>
                    <h1 class='text-xl font-bold text-blue-400'>Total Pengunjung</h1>
                    <p id='date-display' class='text-gray-400 text-xs'>Tanggal: -</p>
                </div>
                <div class='text-5xl font-extrabold text-green-400' id='counter-display'>0</div>
            </div>
            <div class='flex gap-2'>
                <button id='btn-manual' class='flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition text-sm'>+1 Manual</button>
                <button id='btn-save-log' class='flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition text-sm'>Simpan Data</button>
            </div>
            <div class='bg-gray-800 p-3 rounded-lg border border-gray-700'>
                <h2 class='text-xs font-bold text-gray-400 mb-1'>Log Server:</h2>
                <div id='log-display' class='text-xs font-mono text-green-300 break-words whitespace-pre-wrap'>Sistem siap...</div>
            </div>
        </div>

        <div class="w-full text-center py-4 mt-2 border-t border-gray-800">
            <p class="text-xs text-gray-600 tracking-wide">
                dikembangkan oleh <span class="font-semibold text-gray-500">Rangga Putra Anasta</span> | 2026
            </p>
        </div>
    </div>

    <script type='module'>
        import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import{getAuth,signInAnonymously,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import{getFirestore,doc,setDoc}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        const firebaseConfig={
            apiKey:'AIzaSyDQDrNzj_rJ6oV1F1Z-YZGBhZQPma_fcZU',
            authDomain:'penghitungpengunjugkamerav2.firebaseapp.com',
            projectId:'penghitungpengunjugkamerav2',
            storageBucket:'penghitungpengunjugkamerav2.firebasestorage.app',
            messagingSenderId:'348365552099',
            appId:'1:348365552099:web:1e8a8497ec08ce784348d6'
        };
        
        const app=initializeApp(firebaseConfig);
        const auth=getAuth(app);
        const db=getFirestore(app);
        const appId='default-app-id';
        let currentUser=null;
        
        signInAnonymously(auth);
        onAuthStateChanged(auth,(user)=>{currentUser=user;});
        
        const video=document.getElementById('webcam');
        const canvas=document.getElementById('output_canvas');
        const ctx=canvas.getContext('2d');
        const loadingMsg=document.getElementById('loading-msg');
        const startPanel=document.getElementById('start-panel');
        const counterDisplay=document.getElementById('counter-display');
        const dateDisplay=document.getElementById('date-display');
        const logDisplay=document.getElementById('log-display');
        
        let aiModel=null;
        let dailyCount=0;
        let hourlyLogs=[];
        
        let trackedPersons = []; 
        let idCounter = 0;
        const MAX_DISTANCE = 150; 
        
        const today=new Date();
        const dateString=today.getDate().toString().padStart(2,'0')+'-'+(today.getMonth()+1).toString().padStart(2,'0')+'-'+today.getFullYear();
        dateDisplay.innerText='Tanggal: '+dateString;
        
        document.getElementById('btn-start-app').addEventListener('click',async()=>{
            startPanel.style.display='none';
            loadingMsg.style.display='block';
            await startCamera();
        });
        
        async function startCamera(){
            try{
                loadingMsg.innerHTML='<div class="spinner"></div><div class="font-bold text-white">Membuka Kamera...</div>';
                let stream;
                try{
                    stream=await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 480 }, height: { ideal: 360 } }
                    });
                }catch(err){
                    stream=await navigator.mediaDevices.getUserMedia({video:true});
                }
                video.srcObject=stream;
                video.onloadedmetadata=async()=>{
                    await video.play();
                    await initializeAI();
                };
            }catch(error){
                loadingMsg.innerHTML='<div class="text-red-400 mb-2 font-bold">Kamera Gagal</div><span class="text-xs text-yellow-300">'+error.message+'</span>';
            }
        }
        
        async function initializeAI(){
            try{
                loadingMsg.innerHTML='<div class="spinner"></div><div class="font-bold text-blue-400 text-sm">Memuat AI...</div>';
                aiModel=await cocoSsd.load({base:'lite_mobilenet_v2'});
                loadingMsg.style.display='none';
                predictWebcam();
            }catch(error){
                loadingMsg.innerHTML='<div class="text-red-400 font-bold mb-2">Gagal Memuat AI</div><button id="btn-retry" class="bg-red-600 hover:bg-red-500 text-white py-1 px-3 rounded text-sm">Coba Lagi</button>';
                document.getElementById('btn-retry').addEventListener('click',initializeAI);
            }
        }
        
        async function predictWebcam(){
            if(video.videoWidth===0||video.videoHeight===0){
                requestAnimationFrame(predictWebcam);
                return;
            }
            canvas.width=video.videoWidth;
            canvas.height=video.videoHeight;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height); 
            
            const lineY=canvas.height/2;
            ctx.beginPath();
            ctx.moveTo(0,lineY);
            ctx.lineTo(canvas.width,lineY);
            ctx.lineWidth=3;
            ctx.strokeStyle='rgba(255, 0, 0, 0.7)';
            ctx.stroke();
            
            if(aiModel){
                const predictions=await aiModel.detect(video);
                let currentDetections = [];
                
                for(let prediction of predictions){
                    if(prediction.class==='person'&&prediction.score>0.5){
                        const[x,y,width,height]=prediction.bbox;
                        currentDetections.push({
                            x: x, y: y, w: width, h: height,
                            cx: x + (width/2), cy: y + (height/2)
                        });
                    }
                }
                
                let newTrackedPersons = [];
                let availableTracks = [...trackedPersons];
                
                for(let det of currentDetections){
                    let matchedIdx = -1;
                    let minDistance = MAX_DISTANCE;
                    
                    for(let i=0; i<availableTracks.length; i++){
                        let track = availableTracks[i];
                        let dist = Math.hypot(det.cx - track.cx, det.cy - track.cy);
                        if(dist < minDistance){
                            minDistance = dist;
                            matchedIdx = i;
                        }
                    }
                    
                    if(matchedIdx !== -1){
                        let matchedPerson = availableTracks[matchedIdx];
                        matchedPerson.cx = det.cx;
                        matchedPerson.cy = det.cy;
                        matchedPerson.bbox = [det.x, det.y, det.w, det.h];
                        matchedPerson.hilang = 0; 
                        
                        if(!matchedPerson.counted){
                            if(matchedPerson.startZone === 'atas' && matchedPerson.cy >= lineY){
                                matchedPerson.counted = true;
                                matchedPerson.color = '#9ca3af'; // Abu-abu
                                dailyCount++;
                                counterDisplay.innerText = dailyCount;
                                counterDisplay.classList.add('text-white');
                                setTimeout(()=>counterDisplay.classList.remove('text-white'),200);
                            }
                            else if(matchedPerson.startZone === 'bawah' && matchedPerson.cy <= lineY){
                                matchedPerson.counted = true; 
                                matchedPerson.color = '#3b82f6'; // Biru (Diabaikan)
                            }
                        }
                        
                        newTrackedPersons.push(matchedPerson);
                        availableTracks.splice(matchedIdx, 1);
                    } else {
                        idCounter++;
                        let asalZone = det.cy < lineY ? 'atas' : 'bawah';
                        
                        newTrackedPersons.push({
                            id: idCounter, cx: det.cx, cy: det.cy,
                            bbox: [det.x, det.y, det.w, det.h],
                            counted: false, hilang: 0,
                            startZone: asalZone, 
                            color: '#22c55e' // Hijau
                        });
                    }
                }
                
                for(let track of availableTracks){
                    track.hilang++;
                    if(track.hilang < 15){ 
                        newTrackedPersons.push(track);
                    }
                }
                trackedPersons = newTrackedPersons;
                
                for(let person of trackedPersons){
                    if(person.hilang === 0){ 
                        ctx.strokeStyle = person.color;
                        ctx.lineWidth = 3;
                        ctx.strokeRect(person.bbox[0], person.bbox[1], person.bbox[2], person.bbox[3]);
                        
                        ctx.fillStyle = person.color;
                        ctx.font = '14px sans-serif';
                        let labelArah = person.startZone === 'atas' ? ' (Msk)' : ' (Klr)';
                        ctx.fillText('ID: ' + person.id + labelArah, person.bbox[0], person.bbox[1] - 5);
                        
                        ctx.beginPath();
                        ctx.arc(person.cx, person.cy, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            }
            requestAnimationFrame(predictWebcam);
        }
        
        function simpanKeLog(isAuto=false){
            const sekarang=new Date();
            const jam=sekarang.getHours().toString().padStart(2,'0');
            const menit=sekarang.getMinutes().toString().padStart(2,'0');
            const logEntry='['+jam+':'+menit+'; '+dailyCount+']';
            if(!isAuto){
                hourlyLogs.push(logEntry);
            }
            const fullLogString='Total: '+dailyCount+'\nUpdate: '+jam+':'+menit;
            logDisplay.innerText=fullLogString+'\nMenyimpan...';
            
            if(!currentUser){
                logDisplay.innerText+='\n❌ Menunggu koneksi...';
                return;
            }
            
            const docRef=doc(db,'artifacts',appId,'public','data','kamera_pengunjung',dateString);
            setDoc(docRef,{
                tanggal:dateString,
                total_pengunjung:dailyCount,
                logs:hourlyLogs,
                waktu_update:sekarang.toISOString(),
                user_id_pengunggah:currentUser.uid
            },{merge:true}).then(()=>{
                logDisplay.innerText=fullLogString+'\n✅ Tersimpan di Cloud';
            }).catch((error)=>{
                logDisplay.innerText=fullLogString+'\n❌ Gagal: '+error.message;
            });
        }
        
        document.getElementById('btn-manual').addEventListener('click',()=>{
            dailyCount++;
            counterDisplay.innerText=dailyCount;
        });
        
        document.getElementById('btn-save-log').addEventListener('click',()=>simpanKeLog(false));
        
        setInterval(()=>{
            if(dailyCount>0){
                simpanKeLog(true);
            }
        },120000);
    </script>
</body>
</html>
